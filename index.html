<h1>omarchy-gmail</h1>
<p>omarchy-gmail is a personal Gmail widget for the owner's own Linux desktop. It shows the unread inbox count and lets the owner read, archive and mark mail from the desktop bar.</p>
<p>It is not offered to the public, and only the owner's own Google account uses it.</p>
